name: Build NeoForge Mod on Windows

on:
  push:
    branches: [ feature/rice-crop-growth ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        shell: cmd
        run: gradlew build
        # 注意：你的项目没有 :client 子模块，所以这里必须是全局的 gradlew build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
